<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barbuch">
<meta name="theme-color" content="#0c1312">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Barbuch Haus Hirt</title>
<style>
/* Layout: Querformat-Split – oben eine Leiste A–Z bzw. Kartenrubriken, links Namenskacheln, rechts das Rezept. Hochformat: Rezept als Vollbild. */
:root{
  --bg:#0c1312; --surface:#172221; --surface2:#20302e; --line:#2c3e3c;
  --fg:#f3f6f5; --muted:#9fb1ae; --accent:#5fd0c4; --on-accent:#06201d;
  --gar:#3a2c14; --gar-fg:#ffd58a; --warn:#ffcf70;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;
  display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.strip{display:flex;gap:4px;padding-block:8px;flex:none;flex-wrap:wrap}
.strip button{flex:1 0 auto;min-width:30px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;font-size:16px;padding:0 6px}
.strip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.strip .mode{background:var(--surface2);font-size:14px;padding:0 10px}
.strip .rec{font-size:14px;padding:0 10px}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding-bottom:8px}
.tiles{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;align-content:start;-webkit-overflow-scrolling:touch}
.gh{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 2px 0}
.gh:first-child{padding-top:0}
.tile{min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;text-align:left;font-weight:600;font-size:16px;line-height:1.15;display:flex;align-items:center;gap:6px}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;margin-left:auto}

.pane{overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;-webkit-overflow-scrolling:touch}
.hint{color:var(--muted);height:100%;display:grid;place-items:center;text-align:center;font-size:15px;line-height:1.5}
.ph{display:flex;align-items:baseline;gap:10px}
.ph h2{margin:0;font-size:24px;line-height:1.1;flex:1}
.ph span{color:var(--muted);font-variant-numeric:tabular-nums}
.top{display:flex;gap:12px;align-items:center;margin-top:8px}
.top svg{width:34px;height:48px;flex:none;color:var(--accent)}
.facts{display:grid;gap:2px;font-size:15px}
.facts b{font-weight:700}
.facts i{font-style:normal;color:var(--muted);display:inline-block;width:62px}
.gar{margin-top:10px;background:var(--gar);color:var(--gar-fg);border-radius:8px;padding:8px 10px;font-size:16px;font-weight:700}
.gar small{font-weight:600;opacity:.8;margin-right:6px}
.ih{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scale{display:flex;gap:4px}
.scale button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:4px 10px;font-weight:700;font-size:14px}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
table{width:100%;border-collapse:collapse;margin-top:4px}
td{padding:7px 0;border-bottom:1px solid var(--line);font-size:17px;vertical-align:baseline}
td.a{width:84px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
td.a small{font-weight:600;font-size:13px;color:var(--muted);margin-left:2px}
ol{margin:6px 0 0;padding-left:20px;display:grid;gap:5px;font-size:15px;line-height:1.35}
.note{margin-top:10px;color:var(--warn);font-size:14px;line-height:1.35}
.tip{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.35}
.close{display:none}

@media (orientation:portrait){
  .main{grid-template-columns:1fr}
  .pane{display:none}
  .pane.open{display:block;position:fixed;inset:0;z-index:10;border-radius:0;border:0;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .pane.open .close{display:block;position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
    height:54px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px}
  .ph h2{font-size:28px}
}
</style>
</head>

 {n:'Ipanema',c:'af',p:'6,50',d:'Limette, brauner Rohrzucker, Ginger Ale',g:'highball',ice:'Crushed Ice',m:'Muddeln + Gebaut',i:[[0.5,'Stk','Limette, geviertelt'],[2,'BL','Brauner Rohrzucker'],[null,'top','Ginger Ale']],gar:'Limettenrad',s:['Limette mit Zucker im Glas muddeln','Crushed Ice dazu','Mit Ginger Ale auffüllen, rühren']},
 {n:'Virgin Hugo',c:'af',p:'6,00',d:'Holundersirup, Minze, Soda',g:'wine',ice:'Eiswürfel',m:'Gebaut',i:[[2,'cl','Holunderblütensirup'],[6,'Blätter','Minze'],[null,'top','Soda']],gar:'Minzzweig, Limettenscheibe',s:['Minze im Glas leicht andrücken','Eis und Sirup dazu','Mit Soda auffüllen, rühren']},
 {n:'Sanbitter Spritz',c:'af',p:'7,50',d:'Sanbitter',g:'wine',ice:'Eiswürfel',m:'Gebaut',i:[[10,'cl','Sanbitter (1 Flasche)'],[6,'cl','Soda']],gar:'Orangenscheibe',s:['Weinglas voll mit Eis','Sanbitter, dann Soda','Einmal rühren'],chk:1,note:'Karte nennt nur Sanbitter – Aufguss (Soda oder alkoholfreier Sekt) bestätigen.'},
 {n:'Kinder Cocktail',c:'af',p:'5,50',d:'Mango-Maracuja-Saft, Sirup',g:'highball',ice:'Eiswürfel',m:'Gebaut',i:[[15,'cl','Mango-Maracuja-Saft'],[1,'cl','Sirup (z. B. Grenadine)']],gar:'Orangenscheibe, Kirsche, Strohhalm',s:['Highball mit Eis, Saft einfüllen','Sirup langsam hineingießen, sinkt nach unten'],chk:1,note:'Welcher Sirup? Auf der Karte nicht genannt.'},
];
D.forEach((d,ix)=>{d.id=ix;d.L=norm(d.n).trim()[0].toUpperCase()});
function norm(s){return s.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,' ')}
const SHORT={ape:'Aperitif',whi:'Whiskey',vod:'Vodka',gin:'Gin',rum:'Rum/Teq.',sour:'Sours',mule:'Mules',gt:'G&T',af:'Ohne Alk.'};
const $=id=>document.getElementById(id);
const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let mode=store.get('bb_mode','az'), filt=null, sel=null, mult=1, recent=store.get('bb_recent',[]);
const LETTERS=[...new Set(D.map(d=>d.L))].sort();
const AZ=[...D].sort((a,b)=>a.n.localeCompare(b.n,'de'));

function renderStrip(){
  const items=mode==='az'?LETTERS.map(l=>[l,l]):CATS.map(([k])=>[k,SHORT[k]]);
  $('strip').innerHTML=
    `<button class="mode" data-mode="1">${mode==='az'?'A–Z ⇄ Karte':'Karte ⇄ A–Z'}</button>`+
    `<button class="rec" data-f="rec" aria-pressed="${filt==='rec'}">Zuletzt</button>`+
    items.map(([k,l])=>`<button data-f="${k}" aria-pressed="${filt===k}">${l}</button>`).join('');
}
function list(){
  if(filt==='rec')return recent.map(i=>D[i]).filter(Boolean);
  if(mode==='az')return AZ.filter(d=>!filt||d.L===filt);
  return D.filter(d=>!filt||d.c===filt);
}
function tile(d){return `<button class="tile" data-id="${d.id}" aria-pressed="${sel===d.id}">${d.n}${d.chk?'<span class="dot" title="Spec prüfen"></span>':''}</button>`}
function renderTiles(){
  const r=list();
  let h='';
  if(!r.length)h=`<div class="gh">Noch nichts geöffnet</div>`;
  else if(mode==='karte'&&!filt){
    CATS.forEach(([k,l])=>{h+=`<div class="gh">${l}</div>`+r.filter(d=>d.c===k).map(tile).join('')});
  } else if(mode==='az'&&!filt){
    LETTERS.forEach(L=>{h+=`<div class="gh">${L}</div>`+r.filter(d=>d.L===L).map(tile).join('')});
  } else h=r.map(tile).join('');
  $('tiles').innerHTML=h;
}
const fmt=n=>(Math.round(n*100)/100).toString().replace('.',',');
function renderPane(){
  const p=$('pane');
  if(sel==null){p.innerHTML=`<div class="hint">Buchstabe oder Rubrik oben antippen,<br>dann den Drink.</div>`;return}
  const d=D[sel];
  p.innerHTML=`
   <div class="ph"><h2>${d.n}</h2><span>€ ${d.p}</span></div>
   <div class="top">${svg(d.g)}<div class="facts">
     <div><i>Glas</i><b>${GLASS[d.g][0]}</b></div>
     <div><i>Eis</i><b>${d.ice}</b></div>
     <div><i>Technik</i><b>${d.m}</b></div>
   </div></div>
   <div class="gar"><small>Garnitur</small>${d.gar}</div>
   <div class="ih"><span class="lbl">Zutaten</span><div class="scale">${[1,2,4].map(m=>`<button data-m="${m}" aria-pressed="${mult===m}">×${m}</button>`).join('')}</div></div>
   <table>${d.i.map(([a,u,n])=>`<tr><td class="a">${a==null?'<small style="margin:0">auffüllen</small>':fmt(a*mult)+'<small>'+u+'</small>'}</td><td>${n}</td></tr>`).join('')}</table>
   <div class="ih"><span class="lbl">Zubereitung</span></div>
   <ol>${d.s.map(s=>`<li>${s}</li>`).join('')}</ol>
   ${d.note?`<div class="note">⚠ ${d.note}</div>`:''}
   ${d.tip?`<div class="tip">${d.tip}</div>`:''}
   <button class="close" id="close">Zurück</button>`;
  p.scrollTop=0;
}
let wake=null;
function pick(id){
  sel=id;mult=1;
  recent=[id,...recent.filter(x=>x!==id)].slice(0,8);store.set('bb_recent',recent);
  renderTiles();renderPane();$('pane').classList.add('open');
  try{if(!wake&&navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mode){mode=mode==='az'?'karte':'az';filt=null;store.set('bb_mode',mode);renderStrip();renderTiles();$('tiles').scrollTop=0;return}
  if(t.dataset.f){filt=filt===t.dataset.f?null:t.dataset.f;renderStrip();renderTiles();$('tiles').scrollTop=0;
    const r=list();if(r.length===1)pick(r[0].id);return}
  if(t.dataset.id){pick(+t.dataset.id);return}
  if(t.dataset.m){mult=+t.dataset.m;const st=$('pane').scrollTop;renderPane();$('pane').scrollTop=st;return}
  if(t.id==='close'){$('pane').classList.remove('open')}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')wake=null});
renderStrip();renderTiles();renderPane();
</script>

</body>
